# Deployed service configuration — E4b-A: Tier 0 INT8 -> Claude Sonnet 5, NO Tier 1.
#
# Tier 1 is absent by MEASUREMENT, not omission. E4 reached macro-F1 0.7254 against a
# 0.7923 bar (a 0.0669 miss, 12x the test_3000 sigma) and E4b-A records that no Tier 1
# experiment remains in the plan. A middle tier here would serve a model the evidence
# rejected.
#
# NO PRICES APPEAR IN THIS FILE. Every USD figure comes from configs/costs.yaml
# (hard rule 5); this file only names which model's rate card to read.

tier0:
  # PRECISION IS THE DEPLOYMENT DECISION, and it is fp32 by measurement (3bg).
  # INT8 is qualified on NO Linux target: it diverges between macOS-arm64 and
  # Linux-aarch64 (60/200 predictions differ, logit correlation 0.866, accuracy
  # 0.9000 -> 0.6400, see 3bf) and collapses to chance on Kaggle's non-VNNI x86
  # (macro-F1 0.000166 against torch FP32's 0.8111). FP32 ONNX shows 0/200
  # disagreements across the same two platforms and matches torch FP32 on x86 at
  # 99.97% argmax agreement. The cost is size and latency, not accuracy: FP32 scores
  # 0.9150 on the canary against INT8's 0.9000.
  #
  # EVERYTHING PRECISION-DEPENDENT IS KEYED BY IT below — the artefact, the router
  # threshold and the canary's measured accuracy. They are not interchangeable: FP32
  # and INT8 have different margin distributions (thresholds 0.1347 vs 0.1154 at the
  # same 4.056% escalation rate), so a threshold from the wrong precision yields an
  # escalation rate nobody chose.
  precision: fp32          # fp32 | int8

  # CONFIGURED, NOT HARDCODED. E1b may replace this with a 10-epoch artefact
  # (fp32_ce10ep_1 -> int8_ce10ep_1). Changing the weights REQUIRES re-running
  # scripts/calibrate_router_threshold.py: the margin distribution moves with the
  # weights, and router_threshold.json records which artefact it was calibrated on so
  # a mismatch is refused at startup rather than served.
  model_dir:
    fp32: models/onnx_ce_1_fp32
    int8: models/int8_ce_1
  max_length: 512

router:
  # Loaded from a file produced by dev_2000 calibration (hard rule 1). NEVER computed
  # at request time — a threshold fitted to live traffic is fitted to the wrong
  # distribution and drifts with no record.
  # Keyed by precision, and ServiceConfig REFUSES a threshold whose recorded precision
  # does not match the served one.
  threshold_file:
    fp32: configs/router_threshold_fp32.json
    int8: configs/router_threshold_int8.json
  signal: margin

tier2:
  # The escalation target. Sonnet 5's rates live in costs.yaml under this exact id.
  model: claude-sonnet-5
  max_output_tokens: 40      # matches the stage-1 budget decision in costs.yaml
  # NULL MEANS OMIT THE KEY, not send null. Sonnet 5 REJECTS `temperature`
  # ("deprecated for this model"), which is why scripts/submit_batch.py passes
  # temperature=None for both Stage 1 legs. The deployed tier must send the same
  # request the baseline was measured with; sending 0.0 here was rejected by the API
  # on every escalation.
  temperature: null
  # Escalation happens ONLY when ANTHROPIC_API_KEY is set. With no key the service
  # returns the Tier 0 answer and marks escalation_skipped=true. It never pretends.
  # Interactive serving is NOT batch: the 50% Batch API discount does not apply and
  # must not be claimed. Offline evaluation still uses batch (hard rule 4).
  batch: false
  # SPEND CAP, in USD. On reaching it the service REFUSES to escalate and returns the
  # Tier 0 answer with escalation_skipped=true — a stop, not a throttle.
  #
  # SCOPED TO THIS SERVICE'S run_id BELOW, and that is the whole point. The ledger also
  # holds every offline experiment run, ~$3.58 of it. Checking this cap against the
  # WHOLE ledger compared $1.00 to $3.58 and made the cap permanently reached: the
  # service refused every escalation and returned escalation_skipped=true on every
  # request, which looks exactly like a healthy service whose router never fires.
  #
  # The project's $15 budget.hard_stop_usd is a DIFFERENT limit and still reads the
  # whole ledger, so serving spend does count against the project even though
  # experiment spend does not count against this cap. The scoping is one-directional
  # on purpose.
  #
  # A cache hit spends nothing and is served without consulting the cap.
  spend_cap_usd: 1.00
  # Names this service's entries in the ledger so live serving spend is separable from
  # the offline experiment runs. IT IS ALSO THE CAP'S ACCOUNTING BUCKET: changing it
  # RESETS spend_cap_usd, because spend recorded under the old tag no longer matches.
  # Deliberate, but a footgun — do not change it casually.
  run_id: serve_tier0_sonnet5

canary:
  # Startup refusal. MEASURED 2026-09-10 on THIS arm64 host with models/int8_ce_1:
  # 180/200 = 0.9000 accuracy on the frozen TRAIN row set in configs/canary_200.json.
  #
  # FLOOR = 0.80, i.e. 0.10 absolute below the measured value. Chosen so it cannot be
  # tripped by benign cross-ISA INT8 numeric jitter — E3 measured the largest FP32/INT8
  # delta in this project at 0.0083, so 0.10 is ~12x that — while sitting far above the
  # failure it exists to catch: Kaggle's non-VNNI x86 scored these same weights at
  # macro-F1 0.0037, i.e. chance, WITH NO ERROR RAISED. HF Spaces is x86.
  #
  # These are TRAIN rows the model was fitted on, so 0.9000 is NOT comparable to the
  # test_3000 accuracy of 0.8563 and must never be reported as an accuracy result.
  # The ROW SET is precision-independent (the same 200 frozen TRAIN rows); the measured
  # accuracy is not, so it is keyed.
  row_set: configs/canary_200.json
  measured_accuracy:
    # MEASURED ON BOTH PLATFORMS and identical on each: 183/200 on macOS-arm64 AND on
    # Linux-aarch64, 0/200 prediction disagreements (3bg).
    fp32: 0.9150
    # macOS-arm64 only. 0.6400 on Linux-aarch64 — which is why INT8 is not served.
    int8: 0.9000
  measured_on:
    fp32: "arm64_local + linux/aarch64 container, models/onnx_ce_1_fp32, 2026-09-11"
    int8: "arm64_local (Apple Silicon) ONLY, models/int8_ce_1, 2026-09-10"
  min_accuracy:
    # Both floors sit ~0.10-0.115 below their measured value, the 3bc construction.
    # The INT8 floor STAYS at 0.80 (3bf): a floor moved to accommodate a failing
    # platform stops measuring health.
    fp32: 0.80
    int8: 0.80
  enabled: true
