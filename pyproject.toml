[project]
name = "reasonable-doubt"
version = "0.1.0"
description = "3-tier cascade for legal contract clause classification (LEDGAR), measured on a cost-vs-accuracy Pareto frontier."
requires-python = ">=3.11"

# Local (Apple Silicon) dependencies only. See CLAUDE.md: bitsandbytes is CUDA-only
# and must never be installed or imported locally; Kaggle deps live in
# requirements-kaggle.txt and are installed inside the Kaggle runtime.
dependencies = [
  "datasets>=2.19",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "anthropic>=0.40",
  "httpx>=0.27",
  "tenacity>=8.3",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "onnxruntime>=1.18",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Local MLX training/serving path (Apple Silicon only).
mlx = [
  "mlx>=0.15",
  "mlx-lm>=0.14",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
